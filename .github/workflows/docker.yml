name: Docker

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cargo test
        working-directory: backend
        run: cargo test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jotel-dev/veilgate
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image contents
        run: |
          echo "Verifying container image does not contain forbidden files or secrets..."
          docker run --rm --user root --entrypoint /bin/sh ghcr.io/jotel-dev/veilgate:latest -c '
            echo "Listing container filesystem in /app:"
            ls -la /app
            ERRORS=0

            echo "Checking for .veilgate directory or files..."
            if [ -e "/.veilgate" ] || [ -e "/app/.veilgate" ] || find / -name ".veilgate" 2>/dev/null | grep -q .; then
              echo "ERROR: .veilgate directory or file detected in container image"
              find / -name ".veilgate" 2>/dev/null
              ERRORS=$((ERRORS + 1))
            fi

            echo "Checking for database files (*.db)..."
            if find / -name "*.db" 2>/dev/null | grep -q .; then
              echo "ERROR: Database file (*.db) detected in container image"
              find / -name "*.db" 2>/dev/null
              ERRORS=$((ERRORS + 1))
            fi

            echo "Checking for environment files (.env*)..."
            if find / -name ".env*" 2>/dev/null | grep -q .; then
              echo "ERROR: Environment file (.env*) detected in container image"
              find / -name ".env*" 2>/dev/null
              ERRORS=$((ERRORS + 1))
            fi

            echo "Checking for docs/design directory..."
            if find / -path "*/docs/design*" 2>/dev/null | grep -q .; then
              echo "ERROR: docs/design folder detected in container image"
              find / -path "*/docs/design*" 2>/dev/null
              ERRORS=$((ERRORS + 1))
            fi

            if [ "$ERRORS" -gt 0 ]; then
              echo "Verification FAILED: $ERRORS forbidden items found in image."
              exit 1
            fi

            echo "Verification PASSED: Image is clean and contains no sensitive files."
          '

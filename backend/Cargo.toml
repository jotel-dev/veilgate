[package]
name = "veilgate-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
tonic = { version = "0.14.6", features = ["tls-ring", "tls-webpki-roots", "transport"] }
zcash_client_backend = { version = "0.24.0", features = ["lightwalletd-tonic-transport", "lightwalletd-tonic-tls-webpki-roots"] }
zcash_keys = { version = "0.16.1", features = ["orchard", "sapling"] }
zcash_protocol = { version = "0.10.6" }
zip32 = "0.2.1"
bip0039 = "0.12"
rpassword = "7.3"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rand = "0.8"
zip321 = "0.9.0"
qrcode = "0.14"
zcash_address = "0.13.0"
